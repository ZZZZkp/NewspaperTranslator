services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "http.server", "8000", "--bind", "0.0.0.0", "--directory", "/app/docs"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/newspaper_translator}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-local-client-id}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-local-client-secret}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-local-refresh-token}
    ports:
      - "8000:8000"
    volumes:
      - app-data:/data
    depends_on:
      - db

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-c", "import time; time.sleep(3600)"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/newspaper_translator}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-local-client-id}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-local-client-secret}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-local-refresh-token}
    volumes:
      - app-data:/data
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newspaper_translator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  app-data:
  postgres-data:
