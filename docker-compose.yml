services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      web:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "newspaper_translator.web"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/newspaper-translator.db}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data}
      GMAIL_CONFIG_PATH: ${GMAIL_CONFIG_PATH:-/app/config/gmail-config.json}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "python", "-m", "newspaper_translator.manage", "check", "--service", "web"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "newspaper_translator.worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/newspaper-translator.db}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data}
      GMAIL_CONFIG_PATH: ${GMAIL_CONFIG_PATH:-/app/config/gmail-config.json}
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "python", "-m", "newspaper_translator.manage", "check", "--service", "worker"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newspaper_translator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  app-data:
  postgres-data:
