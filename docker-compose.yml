services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-http://host.docker.internal:7897}
        HTTPS_PROXY: ${HTTPS_PROXY:-http://host.docker.internal:7897}
        ALL_PROXY: ${ALL_PROXY:-socks5://host.docker.internal:7897}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      web:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-http://host.docker.internal:7897}
        HTTPS_PROXY: ${HTTPS_PROXY:-http://host.docker.internal:7897}
        ALL_PROXY: ${ALL_PROXY:-socks5://host.docker.internal:7897}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db}
    command: ["python", "-m", "newspaper_translator.web"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/newspaper-translator.db}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data}
      GMAIL_CONFIG_PATH: ${GMAIL_CONFIG_PATH:-/app/config/gmail-config.json}
      FOCUS_TAGS: ${FOCUS_TAGS:-}
      MINERU_API_TOKEN: ${MINERU_API_TOKEN:-}
      MINERU_MODEL_VERSION: ${MINERU_MODEL_VERSION:-vlm}
      MINERU_LANGUAGE: ${MINERU_LANGUAGE:-ch}
      MINERU_ENABLE_OCR: ${MINERU_ENABLE_OCR:-false}
      MINERU_ENABLE_TABLE: ${MINERU_ENABLE_TABLE:-true}
      MINERU_ENABLE_FORMULA: ${MINERU_ENABLE_FORMULA:-true}
      MINERU_PAGE_RANGES: ${MINERU_PAGE_RANGES:-}
      MINERU_POLL_INTERVAL_SECONDS: ${MINERU_POLL_INTERVAL_SECONDS:-2}
      MINERU_POLL_TIMEOUT_SECONDS: ${MINERU_POLL_TIMEOUT_SECONDS:-300}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-120}
      GEMINI_TOKEN: ${GEMINI_TOKEN:-}
      GEMINI_API_COMPAT_MODE: ${GEMINI_API_COMPAT_MODE:-standard}
      GOOGLE_GEMINI_BASE_URL: ${GOOGLE_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-120}
      HTTP_PROXY: ${HTTP_PROXY:-http://host.docker.internal:7897}
      HTTPS_PROXY: ${HTTPS_PROXY:-http://host.docker.internal:7897}
      ALL_PROXY: ${ALL_PROXY:-socks5://host.docker.internal:7897}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - app-data:/data
      - ./config:/app/config:ro
      - ./secrets:/app/secrets
    healthcheck:
      test: ["CMD", "python", "-m", "newspaper_translator.manage", "check", "--service", "web"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-http://host.docker.internal:7897}
        HTTPS_PROXY: ${HTTPS_PROXY:-http://host.docker.internal:7897}
        ALL_PROXY: ${ALL_PROXY:-socks5://host.docker.internal:7897}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db}
    command: ["python", "-m", "newspaper_translator.worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/newspaper-translator.db}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data}
      GMAIL_CONFIG_PATH: ${GMAIL_CONFIG_PATH:-/app/config/gmail-config.json}
      FOCUS_TAGS: ${FOCUS_TAGS:-}
      MINERU_API_TOKEN: ${MINERU_API_TOKEN:-}
      MINERU_MODEL_VERSION: ${MINERU_MODEL_VERSION:-vlm}
      MINERU_LANGUAGE: ${MINERU_LANGUAGE:-ch}
      MINERU_ENABLE_OCR: ${MINERU_ENABLE_OCR:-false}
      MINERU_ENABLE_TABLE: ${MINERU_ENABLE_TABLE:-true}
      MINERU_ENABLE_FORMULA: ${MINERU_ENABLE_FORMULA:-true}
      MINERU_PAGE_RANGES: ${MINERU_PAGE_RANGES:-}
      MINERU_POLL_INTERVAL_SECONDS: ${MINERU_POLL_INTERVAL_SECONDS:-2}
      MINERU_POLL_TIMEOUT_SECONDS: ${MINERU_POLL_TIMEOUT_SECONDS:-300}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-120}
      GEMINI_TOKEN: ${GEMINI_TOKEN:-}
      GEMINI_API_COMPAT_MODE: ${GEMINI_API_COMPAT_MODE:-standard}
      GOOGLE_GEMINI_BASE_URL: ${GOOGLE_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-120}
      WORKER_ROLE: ${WORKER_ROLE:-import}
      GMAIL_IMPORT_INTERVAL_SECONDS: ${GMAIL_IMPORT_INTERVAL_SECONDS:-7200}
      ARTICLE_WORKER_CONCURRENCY: ${ARTICLE_WORKER_CONCURRENCY:-4}
      DOCUMENT_WORKER_CONCURRENCY: ${DOCUMENT_WORKER_CONCURRENCY:-2}
      HTTP_PROXY: ${HTTP_PROXY:-http://host.docker.internal:7897}
      HTTPS_PROXY: ${HTTPS_PROXY:-http://host.docker.internal:7897}
      ALL_PROXY: ${ALL_PROXY:-socks5://host.docker.internal:7897}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db}
    volumes:
      - app-data:/data
      - ./config:/app/config:ro
      - ./secrets:/app/secrets
    healthcheck:
      test: ["CMD", "python", "-m", "newspaper_translator.manage", "check", "--service", "worker"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_started

  article-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-http://host.docker.internal:7897}
        HTTPS_PROXY: ${HTTPS_PROXY:-http://host.docker.internal:7897}
        ALL_PROXY: ${ALL_PROXY:-socks5://host.docker.internal:7897}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db}
    command: ["python", "-m", "newspaper_translator.worker"]
    environment:
      WORKER_ROLE: article
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/newspaper-translator.db}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-120}
      GEMINI_TOKEN: ${GEMINI_TOKEN:-}
      GEMINI_API_COMPAT_MODE: ${GEMINI_API_COMPAT_MODE:-standard}
      GOOGLE_GEMINI_BASE_URL: ${GOOGLE_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-120}
      ARTICLE_WORKER_CONCURRENCY: ${ARTICLE_WORKER_CONCURRENCY:-4}
      ARTICLE_WORKER_IDLE_POLL_INTERVAL_SECONDS: ${ARTICLE_WORKER_IDLE_POLL_INTERVAL_SECONDS:-60}
      HTTP_PROXY: ${HTTP_PROXY:-http://host.docker.internal:7897}
      HTTPS_PROXY: ${HTTPS_PROXY:-http://host.docker.internal:7897}
      ALL_PROXY: ${ALL_PROXY:-socks5://host.docker.internal:7897}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db}
    volumes:
      - app-data:/data
      - ./config:/app/config:ro
      - ./secrets:/app/secrets
    depends_on:
      db:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "newspaper_translator.manage", "check", "--service", "worker"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newspaper_translator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  app-data:
  postgres-data:
