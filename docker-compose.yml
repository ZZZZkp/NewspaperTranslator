services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      web:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "newspaper_translator.web"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/newspaper-translator.db}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data}
      GMAIL_CONFIG_PATH: ${GMAIL_CONFIG_PATH:-/app/config/gmail-config.json}
      FOCUS_TAGS: ${FOCUS_TAGS:-}
      MINERU_API_TOKEN: ${MINERU_API_TOKEN:-}
      MINERU_MODEL_VERSION: ${MINERU_MODEL_VERSION:-vlm}
      MINERU_LANGUAGE: ${MINERU_LANGUAGE:-ch}
      MINERU_ENABLE_OCR: ${MINERU_ENABLE_OCR:-false}
      MINERU_ENABLE_TABLE: ${MINERU_ENABLE_TABLE:-true}
      MINERU_ENABLE_FORMULA: ${MINERU_ENABLE_FORMULA:-true}
      MINERU_PAGE_RANGES: ${MINERU_PAGE_RANGES:-}
      MINERU_POLL_INTERVAL_SECONDS: ${MINERU_POLL_INTERVAL_SECONDS:-2}
      MINERU_POLL_TIMEOUT_SECONDS: ${MINERU_POLL_TIMEOUT_SECONDS:-300}
      GEMINI_TOKEN: ${GEMINI_TOKEN:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-120}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - app-data:/data
      - ./config:/app/config:ro
      - ./secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-m", "newspaper_translator.manage", "check", "--service", "web"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "newspaper_translator.worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/newspaper-translator.db}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data}
      GMAIL_CONFIG_PATH: ${GMAIL_CONFIG_PATH:-/app/config/gmail-config.json}
      FOCUS_TAGS: ${FOCUS_TAGS:-}
      MINERU_API_TOKEN: ${MINERU_API_TOKEN:-}
      MINERU_MODEL_VERSION: ${MINERU_MODEL_VERSION:-vlm}
      MINERU_LANGUAGE: ${MINERU_LANGUAGE:-ch}
      MINERU_ENABLE_OCR: ${MINERU_ENABLE_OCR:-false}
      MINERU_ENABLE_TABLE: ${MINERU_ENABLE_TABLE:-true}
      MINERU_ENABLE_FORMULA: ${MINERU_ENABLE_FORMULA:-true}
      MINERU_PAGE_RANGES: ${MINERU_PAGE_RANGES:-}
      MINERU_POLL_INTERVAL_SECONDS: ${MINERU_POLL_INTERVAL_SECONDS:-2}
      MINERU_POLL_TIMEOUT_SECONDS: ${MINERU_POLL_TIMEOUT_SECONDS:-300}
      GEMINI_TOKEN: ${GEMINI_TOKEN:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-120}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db}
    volumes:
      - app-data:/data
      - ./config:/app/config:ro
      - ./secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-m", "newspaper_translator.manage", "check", "--service", "worker"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newspaper_translator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  app-data:
  postgres-data:
