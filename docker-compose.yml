services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "newspaper_translator.web"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/newspaper-translator.db}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-local-client-id}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-local-client-secret}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-local-refresh-token}
    ports:
      - "8000:8000"
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "python", "-m", "newspaper_translator.manage", "check", "--service", "web"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "newspaper_translator.worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/newspaper-translator.db}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-local-client-id}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-local-client-secret}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-local-refresh-token}
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "python", "-m", "newspaper_translator.manage", "check", "--service", "worker"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newspaper_translator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  app-data:
  postgres-data:
